<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Evaluación de Profes</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f0f2f5;color:#1e1e1e;font-size:14px}
.header{background:#1A3A5C;color:#fff;padding:12px 16px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:100}
.escudo{width:28px;height:32px;flex-shrink:0}
.header h1{font-size:15px;font-weight:600;flex:1}
.header p{font-size:10px;opacity:.65}
.sync{background:rgba(255,255,255,.2);border:none;color:#fff;border-radius:8px;padding:6px 10px;font-size:11px;cursor:pointer}
.nav{display:flex;background:#fff;border-bottom:1px solid #e0e0e0;position:sticky;top:56px;z-index:99}
.nav button{flex:1;padding:10px 4px;border:none;background:transparent;color:#999;font-size:11px;cursor:pointer;border-bottom:2px solid transparent}
.nav button.active{color:#1A3A5C;border-bottom-color:#C0272D;font-weight:600}
.page{display:none;padding:12px;padding-bottom:80px;min-height:calc(100vh - 100px)}
.page.active{display:block}
.card{background:#fff;border-radius:12px;border:1px solid #e0e0e0;padding:14px;margin-bottom:10px}
.badge{display:inline-block;font-size:10px;font-weight:600;padding:3px 9px;border-radius:20px}
.verde{background:#D4EAC8;color:#1a5c1a}
.amarillo{background:#FFF9C4;color:#7a5c00}
.rojo{background:#FAE0E1;color:#a00000}
.gris{background:#eee;color:#666}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:9px 14px;border-radius:10px;border:1px solid #e0e0e0;background:#fff;color:#1e1e1e;font-size:13px;cursor:pointer}
.btn-primary{background:#1A3A5C;border-color:#1A3A5C;color:#fff}
.btn-rojo{background:#C0272D;border-color:#C0272D;color:#fff}
.btn-danger{background:#FAE0E1;border-color:#C0272D;color:#C0272D}
.btn-full{width:100%}
.btn-sm{padding:6px 11px;font-size:12px}
.fab{position:fixed;bottom:24px;right:20px;width:56px;height:56px;border-radius:50%;background:#C0272D;color:#fff;border:none;font-size:28px;cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 12px rgba(192,39,45,.4);z-index:999}
.form-group{margin-bottom:14px}
.form-group label{display:block;font-size:12px;font-weight:600;color:#555;margin-bottom:5px}
.form-group input,.form-group select,.form-group textarea{width:100%;padding:10px 12px;border-radius:10px;border:1px solid #e0e0e0;font-size:14px;outline:none;background:#fff;color:#1e1e1e}
.form-group textarea{min-height:70px;resize:vertical;font-family:inherit}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:200;display:flex;align-items:flex-end;justify-content:center}
.modal{background:#fff;border-radius:20px 20px 0 0;width:100%;max-width:500px;max-height:90vh;overflow-y:auto}
.modal-handle{width:40px;height:4px;background:#ddd;border-radius:2px;margin:12px auto 0}
.modal-hdr{padding:14px 18px 10px;border-bottom:1px solid #e0e0e0;display:flex;align-items:center;justify-content:space-between}
.modal-hdr h2{font-size:16px;font-weight:600}
.modal-close{background:none;border:none;font-size:24px;color:#999;cursor:pointer;line-height:1}
.modal-body{padding:16px 18px}
.modal-footer{padding:12px 18px;border-top:1px solid #e0e0e0;display:flex;gap:8px;justify-content:flex-end}
.dim-bar-row{display:flex;align-items:center;gap:8px;margin-bottom:5px}
.dim-key{font-size:10px;font-weight:700;color:#555;width:14px}
.dim-track{flex:1;height:7px;background:#e8e8e8;border-radius:4px;overflow:hidden}
.dim-fill{height:100%;border-radius:4px}
.dim-num{font-size:11px;font-weight:600;width:28px;text-align:right}
.dim-section{margin-bottom:16px}
.dim-header{color:#fff;padding:8px 12px;border-radius:8px 8px 0 0;font-size:12px;font-weight:600}
.dim-body{background:#fff;border:1px solid #e0e0e0;border-top:none;border-radius:0 0 8px 8px}
.ind-row{display:flex;align-items:center;gap:8px;padding:10px 12px;border-bottom:1px solid #f4f4f4}
.ind-row:last-child{border-bottom:none}
.ind-text{flex:1;font-size:12px;line-height:1.4}
.stars{display:flex;gap:4px;flex-shrink:0}
.star{width:30px;height:30px;border-radius:7px;border:1px solid #e0e0e0;background:#fafafa;cursor:pointer;font-size:13px;font-weight:700;display:flex;align-items:center;justify-content:center;color:#bbb}
.star.s1{background:#FAE0E1;border-color:#C0272D;color:#a00000}
.star.s2{background:#FFF9C4;border-color:#B8860B;color:#7a5c00}
.star.s3{background:#D6E4F0;border-color:#1A3A5C;color:#1A3A5C}
.star.s4{background:#D4EAC8;border-color:#66bb6a;color:#1a5c1a}
.dim-avg{text-align:right;padding:6px 12px;font-size:11px;color:#888;border-top:1px solid #f4f4f4;background:#fafafa}
.preview{background:#D6E4F0;border-radius:10px;padding:12px;margin:12px 0}
.preview-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:8px}
.preview-cell{text-align:center;padding:8px 4px;border-radius:8px}
.preview-cell .pn{font-size:18px;font-weight:700}
.preview-cell .pk{font-size:9px;font-weight:600;margin-top:2px}
.preview-global{text-align:center;font-size:13px;color:#555}
.preview-global strong{color:#1A3A5C;font-size:15px}
.scale-legend{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin-bottom:14px}
.scale-item{text-align:center;padding:5px 2px;border-radius:7px}
.scale-item .sn{font-size:15px;font-weight:700;display:block;margin-bottom:1px}
.empty{text-align:center;padding:48px 20px;color:#999}
.empty p{font-size:13px;margin-bottom:14px}
.section-title{font-size:11px;font-weight:700;color:#999;letter-spacing:.8px;text-transform:uppercase;margin:16px 0 8px}
.btn-row{display:flex;gap:8px;margin-top:10px}
.avatar{width:32px;height:32px;border-radius:50%;background:#C0272D;color:#fff;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;flex-shrink:0}
.eval-card{background:#fff;border:1px solid #e0e0e0;border-radius:10px;padding:12px;margin-bottom:8px}
.eval-scores{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;margin:8px 0}
.eval-score{text-align:center;padding:6px 2px;border-radius:7px}
.eval-score .sv{font-size:16px;font-weight:700;display:block}
.eval-score .sk{font-size:9px;font-weight:600}
.etapa-block{margin-bottom:16px;border-radius:12px;overflow:hidden;border:1px solid #e0e0e0}
.etapa-hdr{background:#1A3A5C;color:#fff;padding:10px 14px;display:flex;align-items:center;justify-content:space-between}
.etapa-hdr h3{font-size:13px;font-weight:600}
.etapa-row{display:flex;align-items:center;padding:9px 14px;border-bottom:1px solid #f4f4f4;background:#fff}
.etapa-row:last-child{border-bottom:none}
.etapa-footer{background:#f8f9fb;padding:10px 14px;border-top:1px solid #f4f4f4}
.etapa-dim-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;margin-top:6px}
.etapa-dim-cell{text-align:center;padding:6px 4px;border-radius:7px}
.loading{text-align:center;padding:40px;color:#999}
.spinner{width:32px;height:32px;border:3px solid #e0e0e0;border-top-color:#1A3A5C;border-radius:50%;animation:spin .7s linear infinite;margin:0 auto 12px}
@keyframes spin{to{transform:rotate(360deg)}}
.toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:#333;color:#fff;padding:10px 18px;border-radius:30px;font-size:13px;z-index:500;opacity:0;transition:opacity .3s;pointer-events:none;white-space:nowrap}
.toast.show{opacity:1}
.search-wrap{display:flex;align-items:center;gap:8px;background:#fff;border:1px solid #e0e0e0;border-radius:10px;padding:9px 12px;margin-bottom:12px}
.search-wrap input{flex:1;border:none;background:transparent;font-size:14px;outline:none}
</style>
</head>
<body>

<div class="header">
  <svg class="escudo" viewBox="0 0 224 252" fill="none">
    <rect x="0" y="0" width="50" height="252" fill="#C0272D"/>
    <rect x="174" y="0" width="50" height="252" fill="#C0272D"/>
    <rect x="50" y="0" width="124" height="252" fill="#1A3A5C"/>
    <polygon points="112,70 126,108 167,108 135,131 147,169 112,146 77,169 89,131 57,108 98,108" fill="white"/>
  </svg>
  <div style="flex:1">
    <h1>Evaluación de Profes</h1>
    <p>Coordinación Metodológica</p>
  </div>
  <button class="sync" id="sync-btn" onclick="syncData()">↻ Sincronizar</button>
</div>

<nav class="nav">
  <button class="active" id="nav-profes" onclick="showPage('profes')">👥 Profes</button>
  <button id="nav-evaluar" onclick="showPage('evaluar')">✅ Evaluar</button>
  <button id="nav-historial" onclick="showPage('historial')">🕐 Historial</button>
  <button id="nav-resumen" onclick="showPage('resumen')">📊 Resumen</button>
</nav>

<div id="page-profes" class="page active"></div>
<div id="page-evaluar" class="page"></div>
<div id="page-historial" class="page"></div>
<div id="page-resumen" class="page"></div>

<button class="fab" id="fab-btn">+</button>
<div id="modal-container"></div>
<div class="toast" id="toast"></div>

<script>
// ── CONFIG ────────────────────────────────────────────────────────
const DIMS = {
  A:{label:'A — Metodología',color:'#1A3A5C',inds:[
    'Práctica con estructura clara (entrada, bloque, cierre)',
    'Actividades adaptadas a la edad del grupo',
    'Consignas claras que los jugadores entienden',
    'Corrige con demostración, no solo con palabras',
    'Aprovecha bien el tiempo (poco tiempo parado)',
    'Varía las actividades semana a semana'
  ]},
  B:{label:'B — Vínculo con los chicos',color:'#C0272D',inds:[
    'Saluda y recibe individualmente al llegar',
    'Conoce el nombre de todos',
    'Detecta si alguno llega diferente (triste, cansado)',
    'No hace diferencias entre los que juegan mejor',
    'Tono positivo (alienta más de lo que reta)',
    'Gestiona conflictos sin humillar ni gritar'
  ]},
  C:{label:'C — Dimensión social',color:'#444',inds:[
    'Actividades donde participan todos',
    'Trabaja el sentido de pertenencia al grupo',
    'Incluye al jugador que queda relegado',
    'Aborda valores o convivencia de forma informal'
  ]},
  D:{label:'D — Actitud y compromiso',color:'#7A5C00',inds:[
    'Llega antes que los jugadores',
    'Viene con la sesión planificada',
    'Participa en las reuniones del grupo de profes',
    'Aplica lo trabajado en las reuniones',
    'Comunica novedades relevantes del grupo'
  ]}
};
const ETAPAS = ['Infantil (6-13)','Juvenil (14-Sub20)','Reserva','Mayor'];
const PESOS = {A:.20,B:.35,C:.30,D:.15};
let db = {profes:[],evaluaciones:[]};
let evalProfId = null;
let evalScores = {};

// ── UTILS ─────────────────────────────────────────────────────────
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,5)}
function fmtDate(){return new Date().toLocaleDateString('es-UY',{day:'2-digit',month:'2-digit',year:'numeric'})}
function initials(n){return n.trim().split(/\s+/).map(w=>w[0]).join('').slice(0,2).toUpperCase()}
function avg(arr){const f=(arr||[]).filter(v=>v>0);return f.length?+(f.reduce((a,b)=>a+b,0)/f.length).toFixed(2):null}
function dimAvgs(scores){const r={};for(const d of Object.keys(DIMS))r[d]=avg(scores[d]);return r}
function globalScore(prom){let t=0,p=0;for(const[d,w]of Object.entries(PESOS))if(prom[d]!=null){t+=prom[d]*w;p+=w}return p>0?+(t/p).toFixed(2):null}
function zona(v){if(v==null)return{label:'Sin datos',cls:'gris'};if(v>=3)return{label:'Sólido',cls:'verde'};if(v>=2)return{label:'En desarrollo',cls:'amarillo'};return{label:'Atención',cls:'rojo'}}
function barColor(v){if(!v)return'#ddd';if(v>=3)return'#2E7D32';if(v>=2)return'#B8860B';return'#C0272D'}
function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2500)}

// ── API ───────────────────────────────────────────────────────────
async function loadData(){
  document.getElementById('page-profes').innerHTML='<div class="loading"><div class="spinner"></div><p>Cargando datos...</p></div>';
  try{
    const res=await fetch('/api/data');
    if(!res.ok)throw new Error('Error');
    const parsed=await res.json();
    if(parsed&&Array.isArray(parsed.profes)){db=parsed;}
  }catch(e){
    toast('Sin conexión — datos locales');
  }
  renderAll();
}

async function saveData(){
  try{
    await fetch('/api/data',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify(db)
    });
  }catch(e){toast('Error al guardar');}
}

async function syncData(){
  document.getElementById('sync-btn').textContent='↻ Sincronizando...';
  await loadData();
  document.getElementById('sync-btn').textContent='↻ Sincronizar';
  toast('✅ Sincronizado — '+db.profes.length+' profes');
}

// ── RENDER ────────────────────────────────────────────────────────
function renderAll(){renderProfes();renderEvaluar();renderHistorial();renderResumen();}

function renderProfes(){
  const page=document.getElementById('page-profes');
  const q=(document.getElementById('search-input')||{value:''}).value.toLowerCase();
  if(!db.profes.length){
    page.innerHTML=`<div class="empty"><p>Todavía no hay profes.</p><button class="btn btn-primary" onclick="abrirAddProfe()">+ Agregar primer profe</button></div>`;
    return;
  }
  const filtered=db.profes.filter(p=>(p.name+p.etapa).toLowerCase().includes(q));
  let html=`<div class="search-wrap"><span>🔍</span><input type="text" placeholder="Buscar profe..." id="search-input" oninput="renderProfes()" value="${q}"></div>`;
  const byEtapa={};
  for(const p of filtered){if(!byEtapa[p.etapa])byEtapa[p.etapa]=[];byEtapa[p.etapa].push(p);}
  for(const[et,profs]of Object.entries(byEtapa)){
    html+=`<div class="section-title">${et}</div>`;
    for(const p of profs){
      const evs=db.evaluaciones.filter(e=>e.profId===p.id);
      const last=evs.length?evs[evs.length-1]:null;
      const prom=last?dimAvgs(last.scores):{A:null,B:null,C:null,D:null};
      const gs=last?globalScore(prom):null;
      const z=zona(gs);
      const bars=Object.keys(DIMS).map(d=>{const v=prom[d];const w=v?Math.round((v/4)*100):0;return`<div class="dim-bar-row"><span class="dim-key">${d}</span><div class="dim-track"><div class="dim-fill" style="width:${w}%;background:${barColor(v)}"></div></div><span class="dim-num" style="color:${barColor(v)}">${v||'—'}</span></div>`;}).join('');
      html+=`<div class="card">
        <div style="display:flex;align-items:flex-start;justify-content:space-between;gap:8px;margin-bottom:10px">
          <div><div style="font-size:15px;font-weight:600">${p.name}</div><div style="font-size:11px;color:#999;margin-top:2px">${evs.length} evaluación${evs.length!==1?'es':''}</div></div>
          <div style="text-align:right"><span class="badge ${z.cls}">${z.label}</span>${gs!=null?`<div style="font-size:18px;font-weight:700;color:#1A3A5C;margin-top:3px">${gs}</div>`:''}</div>
        </div>
        ${last?`<div>${bars}</div>`:'<p style="font-size:12px;color:#999;text-align:center;padding:4px">Sin evaluaciones aún</p>'}
        <div class="btn-row">
          <button class="btn btn-sm" onclick="verProfe('${p.id}')">Ver detalle</button>
          <button class="btn btn-primary btn-sm" onclick="startEval('${p.id}')">+ Evaluar</button>
        </div>
      </div>`;
    }
  }
  page.innerHTML=html;
}

function renderEvaluar(){
  const page=document.getElementById('page-evaluar');
  if(!evalProfId){
    if(!db.profes.length){page.innerHTML='<div class="empty"><p>Primero agregá un profe desde la pestaña Profes.</p></div>';return;}
    page.innerHTML=`<div class="form-group"><label>Seleccioná el profe a evaluar</label><select onchange="if(this.value)startEval(this.value)"><option value="">— elegir profe —</option>${db.profes.map(p=>`<option value="${p.id}">${p.name} (${p.etapa})</option>`).join('')}</select></div>`;
    return;
  }
  const prof=db.profes.find(p=>p.id===evalProfId);
  if(!prof)return;
  const prom=dimAvgs(evalScores);
  const gs=globalScore(prom);
  const z=zona(gs);
  let html=`<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px">
    <div><strong style="font-size:15px">${prof.name}</strong><br><span style="font-size:11px;color:#999">${prof.etapa} · ${fmtDate()}</span></div>
    <button class="btn btn-sm" onclick="evalProfId=null;evalScores={};renderEvaluar()">Cambiar</button>
  </div>
  <div class="scale-legend">
    <div class="scale-item" style="background:#FAE0E1"><span class="sn" style="color:#a00000">1</span><span style="font-size:9px;color:#a00000">No lo hace</span></div>
    <div class="scale-item" style="background:#FFF9C4"><span class="sn" style="color:#7a5c00">2</span><span style="font-size:9px;color:#7a5c00">A veces</span></div>
    <div class="scale-item" style="background:#D6E4F0"><span class="sn" style="color:#1A3A5C">3</span><span style="font-size:9px;color:#1A3A5C">Lo hace bien</span></div>
    <div class="scale-item" style="background:#D4EAC8"><span class="sn" style="color:#1a5c1a">4</span><span style="font-size:9px;color:#1a5c1a">Referente</span></div>
  </div>`;
  for(const[dk,dv]of Object.entries(DIMS)){
    const vals=evalScores[dk]||[];
    const a=avg(vals);
    html+=`<div class="dim-section"><div class="dim-header" style="background:${dv.color}">${dv.label}</div><div class="dim-body">`;
    dv.inds.forEach((ind,i)=>{
      const cur=vals[i]||0;
      const stars=[1,2,3,4].map(n=>`<button class="star${cur===n?' s'+n:''}" onclick="setScore('${dk}',${i},${n})">${n}</button>`).join('');
      html+=`<div class="ind-row"><span class="ind-text">${ind}</span><div class="stars">${stars}</div></div>`;
    });
    html+=`<div class="dim-avg">Promedio ${dk}: <strong>${a!=null?a:'—'}</strong></div></div></div>`;
  }
  html+=`<div class="preview">
    <div style="font-size:11px;font-weight:600;color:#1A3A5C;margin-bottom:8px">Vista previa del perfil</div>
    <div class="preview-grid">${Object.keys(DIMS).map(d=>{const v=prom[d];const z2=zona(v);return`<div class="preview-cell ${z2.cls}"><div class="pn">${v||'—'}</div><div class="pk">${d}</div></div>`;}).join('')}</div>
    <div class="preview-global">Global: <strong>${gs||'—'}</strong> — <span class="badge ${z.cls}">${z.label}</span></div>
  </div>
  <div class="form-group"><label>Observaciones (opcional)</label><textarea id="eval-obs" placeholder="Lo que observaste, compromisos acordados..."></textarea></div>
  <button class="btn btn-rojo btn-full" onclick="guardarEval()">Guardar evaluación</button>`;
  page.innerHTML=html;
}

function renderHistorial(){
  const page=document.getElementById('page-historial');
  if(!db.evaluaciones.length){page.innerHTML='<div class="empty"><p>Todavía no hay evaluaciones guardadas.</p></div>';return;}
  const grouped={};
  for(const ev of db.evaluaciones){if(!grouped[ev.profId])grouped[ev.profId]=[];grouped[ev.profId].push(ev);}
  let html='';
  for(const[pid,evs]of Object.entries(grouped)){
    const prof=db.profes.find(p=>p.id===pid);
    if(!prof)continue;
    html+=`<div class="section-title">${prof.name} — ${prof.etapa}</div>`;
    [...evs].reverse().forEach(ev=>{
      const prom=dimAvgs(ev.scores);const gs=globalScore(prom);const z=zona(gs);
      html+=`<div class="eval-card">
        <div style="display:flex;justify-content:space-between;align-items:center"><span style="font-size:11px;color:#999">📅 ${ev.date}</span><span class="badge ${z.cls}">${z.label} — ${gs||'—'}</span></div>
        <div class="eval-scores">${Object.keys(DIMS).map(d=>{const v=prom[d];const z2=zona(v);return`<div class="eval-score ${z2.cls}"><span class="sv">${v||'—'}</span><span class="sk">${d}</span></div>`;}).join('')}</div>
        ${ev.obs?`<p style="font-size:11px;color:#999;font-style:italic">"${ev.obs}"</p>`:''}
        <button class="btn btn-sm btn-danger" style="margin-top:8px" onclick="borrarEval('${ev.id}')">Eliminar</button>
      </div>`;
    });
  }
  page.innerHTML=html;
}

function renderResumen(){
  const page=document.getElementById('page-resumen');
  if(!db.profes.length){page.innerHTML='<div class="empty"><p>Cargá profes y evaluaciones para ver el resumen.</p></div>';return;}
  const byEtapa={};
  for(const p of db.profes){
    const evs=db.evaluaciones.filter(e=>e.profId===p.id);
    const last=evs.length?evs[evs.length-1]:null;
    const prom=last?dimAvgs(last.scores):{A:null,B:null,C:null,D:null};
    const gs=last?globalScore(prom):null;
    const et=p.etapa;
    if(!byEtapa[et])byEtapa[et]={profes:[],gs:[],A:[],B:[],C:[],D:[]};
    byEtapa[et].profes.push({...p,prom,gs});
    if(gs!=null)byEtapa[et].gs.push(gs);
    for(const d of['A','B','C','D'])if(prom[d]!=null)byEtapa[et][d].push(prom[d]);
  }
  const avgArr=arr=>arr.length?+(arr.reduce((a,b)=>a+b,0)/arr.length).toFixed(2):null;
  let html='';
  for(const[et,ed]of Object.entries(byEtapa)){
    const gs=avgArr(ed.gs);const z=zona(gs);
    html+=`<div class="etapa-block">
      <div class="etapa-hdr"><h3>${et} — ${ed.profes.length} profe${ed.profes.length!==1?'s':''}</h3><div><span style="font-size:20px;font-weight:700">${gs||'—'}</span><br><span class="badge ${z.cls}" style="font-size:9px">${z.label}</span></div></div>
      <div>${ed.profes.map(p=>{const z2=zona(p.gs);return`<div class="etapa-row"><div class="avatar">${initials(p.name)}</div><span style="font-size:13px;font-weight:500;margin-left:8px;flex:1">${p.name}</span><div style="display:flex;gap:4px;align-items:center">${['A','B','C','D'].map(d=>`<span style="font-size:10px;font-weight:600;color:${barColor(p.prom[d])}">${d}:${p.prom[d]||'—'}</span>`).join('')}<span class="badge ${z2.cls}" style="font-size:9px;margin-left:4px">${p.gs||'—'}</span></div></div>`;}).join('')}</div>
      <div class="etapa-footer"><div style="font-size:10px;color:#999;margin-bottom:6px;font-weight:500">Promedio por dimensión</div><div class="etapa-dim-grid">${['A','B','C','D'].map(d=>{const v=avgArr(ed[d]);const z2=zona(v);return`<div class="etapa-dim-cell ${z2.cls}"><div style="font-size:15px;font-weight:700">${v||'—'}</div><div style="font-size:9px;font-weight:600">${d}</div></div>`;}).join('')}</div></div>
    </div>`;
  }
  page.innerHTML=html;
}

// ── ACCIONES ──────────────────────────────────────────────────────
function setScore(dim,idx,val){
  if(!evalScores[dim])evalScores[dim]=DIMS[dim].inds.map(()=>0);
  evalScores[dim][idx]=evalScores[dim][idx]===val?0:val;
  renderEvaluar();
}

function startEval(profId){
  evalProfId=profId;
  evalScores={};
  for(const d of Object.keys(DIMS))evalScores[d]=DIMS[d].inds.map(()=>0);
  showPage('evaluar');
  renderEvaluar();
}

async function guardarEval(){
  if(!evalProfId)return;
  const obs=document.getElementById('eval-obs');
  db.evaluaciones.push({id:uid(),profId:evalProfId,date:fmtDate(),scores:JSON.parse(JSON.stringify(evalScores)),obs:obs?obs.value.trim():''});
  await saveData();
  evalProfId=null;evalScores={};
  showPage('historial');renderAll();toast('✅ Evaluación guardada');
}

async function borrarEval(id){
  if(!confirm('¿Eliminar esta evaluación?'))return;
  db.evaluaciones=db.evaluaciones.filter(e=>e.id!==id);
  await saveData();renderAll();toast('Evaluación eliminada');
}

function verProfe(profId){
  const prof=db.profes.find(p=>p.id===profId);if(!prof)return;
  const evs=db.evaluaciones.filter(e=>e.profId===profId);
  const last=evs.length?evs[evs.length-1]:null;
  const prom=last?dimAvgs(last.scores):{};
  const gs=last?globalScore(prom):null;
  const z=zona(gs);
  let html=`<div style="background:#1A3A5C;color:#fff;border-radius:12px;padding:14px;margin-bottom:14px;display:flex;align-items:center;gap:12px">
    <div style="width:48px;height:48px;border-radius:50%;background:#C0272D;color:#fff;display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:700;flex-shrink:0">${initials(prof.name)}</div>
    <div style="flex:1"><div style="font-size:16px;font-weight:600">${prof.name}</div><div style="font-size:11px;opacity:.7">${prof.etapa}</div></div>
    <div style="text-align:right"><div style="font-size:30px;font-weight:700">${gs||'—'}</div><span class="badge ${z.cls}" style="font-size:9px">${z.label}</span></div>
  </div>`;
  if(evs.length){
    html+=`<div class="section-title">${evs.length} evaluación${evs.length!==1?'es':''}</div>`;
    [...evs].reverse().forEach(ev=>{
      const p2=dimAvgs(ev.scores);const gs2=globalScore(p2);const z2=zona(gs2);
      html+=`<div class="eval-card"><div style="display:flex;justify-content:space-between"><span style="font-size:11px;color:#999">📅 ${ev.date}</span><span class="badge ${z2.cls}">${z2.label} — ${gs2||'—'}</span></div><div class="eval-scores">${Object.keys(DIMS).map(d=>{const v=p2[d];const z3=zona(v);return`<div class="eval-score ${z3.cls}"><span class="sv">${v||'—'}</span><span class="sk">${d}</span></div>`;}).join('')}</div>${ev.obs?`<p style="font-size:11px;color:#999;font-style:italic;margin-top:6px">"${ev.obs}"</p>`:''}</div>`;
    });
  }else{html+='<div class="empty"><p>Sin evaluaciones aún.</p></div>';}
  html+=`<div class="btn-row"><button class="btn btn-primary" style="flex:1" onclick="closeModal();startEval('${profId}')">+ Nueva evaluación</button><button class="btn btn-danger" onclick="borrarProfe('${profId}')">Eliminar</button></div>`;
  openModal(prof.name,html);
}

async function borrarProfe(id){
  if(!confirm('¿Eliminar este profe y todas sus evaluaciones?'))return;
  db.profes=db.profes.filter(p=>p.id!==id);
  db.evaluaciones=db.evaluaciones.filter(e=>e.profId!==id);
  await saveData();closeModal();renderAll();toast('Profe eliminado');
}

function abrirAddProfe(){
  const html=`<div class="form-group"><label>Nombre completo</label><input type="text" id="new-name" placeholder="Ej: Juan García" autocomplete="off"></div>
    <div class="form-group"><label>Etapa</label><select id="new-etapa">${ETAPAS.map(e=>`<option>${e}</option>`).join('')}</select></div>`;
  openModal('Agregar profe',html,async()=>{
    const name=document.getElementById('new-name').value.trim();
    const etapa=document.getElementById('new-etapa').value;
    if(!name){toast('Ingresá el nombre');return false;}
    db.profes.push({id:uid(),name,etapa});
    await saveData();renderAll();toast('✅ Profe agregado');return true;
  },'Agregar');
}

// ── MODAL ─────────────────────────────────────────────────────────
function openModal(title,body,onConfirm,confirmLabel){
  closeModal();
  const overlay=document.createElement('div');
  overlay.className='modal-overlay';overlay.id='modal-overlay';
  overlay.addEventListener('click',e=>{if(e.target===overlay)closeModal();});
  const footer=onConfirm
    ?`<button class="btn" onclick="closeModal()">Cancelar</button><button class="btn btn-primary" onclick="(window._mc&&window._mc().then(ok=>{if(ok)closeModal()}))">${confirmLabel||'Guardar'}</button>`
    :`<button class="btn btn-primary btn-full" onclick="closeModal()">Cerrar</button>`;
  overlay.innerHTML=`<div class="modal"><div class="modal-handle"></div><div class="modal-hdr"><h2>${title}</h2><button class="modal-close" onclick="closeModal()">×</button></div><div class="modal-body">${body}</div><div class="modal-footer">${footer}</div></div>`;
  document.body.appendChild(overlay);
  if(onConfirm)window._mc=onConfirm;
  setTimeout(()=>{const inp=overlay.querySelector('input');if(inp)inp.focus();},200);
}

function closeModal(){
  const o=document.getElementById('modal-overlay');if(o)o.remove();
  window._mc=null;
}

// ── NAV ───────────────────────────────────────────────────────────
function showPage(id){
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  document.querySelectorAll('.nav button').forEach(b=>b.classList.remove('active'));
  document.getElementById('page-'+id).classList.add('active');
  document.getElementById('nav-'+id).classList.add('active');
  if(id==='historial')renderHistorial();
  if(id==='resumen')renderResumen();
  if(id==='profes')renderProfes();
  if(id==='evaluar'&&!evalProfId)renderEvaluar();
}

// ── INIT ──────────────────────────────────────────────────────────
document.getElementById('fab-btn').addEventListener('click', function(e){
  e.preventDefault();
  e.stopPropagation();
  abrirAddProfe();
});

document.getElementById('fab-btn').addEventListener('touchend', function(e){
  e.preventDefault();
  e.stopPropagation();
  abrirAddProfe();
});

loadData();
</script>
